<script>
async function updateLastLogDate() {
    try {
        const response = await fetch('cronjob-rsync-git.sh.log');
        const text = await response.text();
        
        const lines = text.trim().split('\n');
        const lastStopLine = lines.filter(line => line.includes('Stop:')).pop();
        
        if (lastStopLine) {
            const dateStr = lastStopLine.split('Stop:')[1];
            const displayDate = dateStr.replace('_', ' ');
            
            document.getElementById("lastModified").innerHTML = "Updated: (" + displayDate + ")";
            document.title = "Bidang BMD - Kota Serang (" + displayDate + ")";
        }
    } catch (error) {
        console.error("Gagal memuat log:", error);
        document.getElementById("lastModified").innerHTML = "Updated: Error loading log";
    }
}

updateLastLogDate();

function CpyTotClpBrd(cpdtx) {
  var copyText = document.getElementById(cpdtx);
  copyText.select();
  copyText.setSelectionRange(0, 999);
  navigator.clipboard.writeText(copyText.value);
  setTimeout(function myGreeting() { alert("Copied text: \n" + copyText.value); }, 384);
}

setInterval('window.location.reload()', 29000);

/* --- Skrip Animasi Matrix Rain --- */
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const katakana = 'アカサタナハマヤラワキシチニヒミリウクトスツヌフムユルエケセテネヘメレオコソトノホモヨロヲン';
const kanji = '財産管理市職員行調開発情報運用務';
const numbers = '0123456789';
const alphabet = katakana + kanji + numbers;

const fontSize = 14;
const columns = canvas.width / fontSize; 
const drops = [];

for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#228822'; // Warna hijau agak gelap agar teks foreground jelas
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.995) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 33);
</script>
